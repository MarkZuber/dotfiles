# starship prompt — https://starship.rs/config/
# Left: where you are and whether the last command worked. Right: everything else
# (language versions, duration, jobs), so the input line stays short.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 1000
palette = "catppuccin_mocha"

# Two-line frame like the old powerlevel10k prompt. Line 1: forge icon, path from ~, branch,
# counted status. Line 2: the input, with exit status, duration, whatever language/tool modules
# apply ($all), and the time on the right (right_format, which zsh draws as RPROMPT).
# The right side is not pushed to the edge of line 1 with $fill: a line exactly as wide as the
# terminal gets wrapped by the terminal's reflow on resize, and zsh's redraw then leaves the
# extra rows behind as stacked copies of the prompt. zsh places RPROMPT itself and hides it when
# it no longer fits.
# The time is the moment Enter was pressed, not when the prompt appeared: .zshrc redraws the
# prompt on Enter, so scrollback shows when each command started.
format = """
[╭─ ](overlay1)${custom.git_host}$directory$git_branch$git_state$git_status
[╰─](overlay1)$character"""

right_format = "$status$cmd_duration$all$time"

# The newline is written into format above; this module would add a second one via $all.
[line_break]
disabled = true

[status]
disabled = false
success_symbol = "[✔](green)"
symbol = "[✘](red)"
# maybe_int is the exit code only when it isn't 0 and has no named meaning (e.g. SIGINT).
format = "$symbol( [$common_meaning$signal_name$maybe_int]($style)) "
style = "red"
map_symbol = false

[time]
disabled = false
time_format = "%I:%M:%S %p"
format = "[ $time]($style)"
style = "subtext1"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
format = "$symbol "

[directory]
style = "bold lavender"
# Full path from ~ (as p10k showed it), shortened from the left only past 8 levels; inside a
# repo the repo root's name is highlighted.
truncation_length = 8
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_style = "bold blue"
read_only = " "

# GitHub / GitLab / Bitbucket / plain-git logo from origin's URL. Starship has no built-in
# module for the remote's host, so this asks git; require_repo skips it outside a repo.
# (Nerd Font glyphs are written as \u escapes so they survive editors that drop them.)
[custom.git_host]
command = """
case "$(git remote get-url origin 2>/dev/null)" in
  *github*) printf '' ;;
  *gitlab*) printf '' ;;
  *bitbucket*) printf '' ;;
  *) printf '' ;;
esac
"""
require_repo = true
when = true
shell = ["sh"]
format = "[$output ]($style)"
style = "bold blue"

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold mauve"

# Counts per kind, like p10k: +staged !modified ?untracked ✘deleted ⇡ahead ⇣behind *stash.
[git_status]
# Each count below carries its own trailing space.
format = "([$all_status$ahead_behind]($style))"
style = "bold peach"
conflicted = "~$count "
staged = "[+$count](green) "
modified = "[!$count](yellow) "
renamed = "»$count "
deleted = "[✘$count](red) "
untracked = "[?$count](sapphire) "
stashed = "*$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇡$ahead_count⇣$behind_count "
up_to_date = ""

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[username]
show_always = false

[hostname]
ssh_only = true

[aws]
disabled = true

[gcloud]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true

# The five languages the editor is set up for; starship only shows them inside a project.
[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '

[rust]
symbol = " "
format = "[$symbol($version)]($style) "

[c]
symbol = " "
format = "[$symbol($version(-$name))]($style) "

[cpp]
symbol = " "

[golang]
symbol = " "
format = "[$symbol($version)]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
