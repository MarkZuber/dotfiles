# television (tv) config — https://alexpasmantier.github.io/television/
# Channels (git-branch, git-log, docker-*, procs, ...) are the community set fetched by
# `tv update-channels` into ~/.config/television/cable/; `tv list-channels` shows them.

tick_rate = 50
default_channel = "files"
history_size = 200
global_history = false

[ui]
ui_scale = 100
orientation = "landscape"
theme = "catppuccin"

[ui.input_bar]
position = "top"
prompt = ">"
border_type = "rounded"

[ui.status_bar]
separator_open = ""
separator_close = ""
hidden = false

[ui.results_panel]
border_type = "rounded"

[ui.preview_panel]
size = 60
scrollbar = true
border_type = "rounded"
hidden = false

[ui.help_panel]
show_categories = true
hidden = true

[ui.remote_control]
show_channel_descriptions = true
sort_alphabetically = true

[keybindings]
esc = "quit"
ctrl-c = "quit"
down = "select_next_entry"
ctrl-n = "select_next_entry"
ctrl-j = "select_next_entry"
up = "select_prev_entry"
ctrl-p = "select_prev_entry"
ctrl-k = "select_prev_entry"
ctrl-up = "select_prev_history"
ctrl-down = "select_next_history"
tab = "toggle_selection_down"
backtab = "toggle_selection_up"
enter = "confirm_selection"
ctrl-d = "scroll_preview_half_page_down"
ctrl-u = "scroll_preview_half_page_up"
ctrl-f = "cycle_previews"
ctrl-y = "copy_entry_to_clipboard"
ctrl-s = "cycle_sources"
ctrl-r = "toggle_remote_control"
ctrl-x = "toggle_action_picker"
ctrl-o = "toggle_preview"
ctrl-g = "toggle_help"
f10 = "toggle_status_bar"
backspace = "delete_prev_char"
ctrl-w = "delete_prev_word"
delete = "delete_next_char"
left = "go_to_prev_char"
right = "go_to_next_char"

[shell_integration]
fallback_channel = "files"

# Ctrl+T after one of these commands opens the matching channel instead of plain files.
[shell_integration.channel_triggers]
"alias" = ["alias", "unalias"]
"env" = ["export", "unset"]
"dirs" = ["cd", "ls", "rmdir", "z"]
"files" = [
  "cat",
  "less",
  "head",
  "tail",
  "vim",
  "nvim",
  "nano",
  "bat",
  "glow",
  "cp",
  "mv",
  "rm",
  "touch",
  "chmod",
  "chown",
  "ln",
  "tar",
  "zip",
  "unzip",
  "gzip",
  "gunzip",
  "xz",
]
"git-diff" = ["git add", "git restore"]
"git-branch" = [
  "git checkout",
  "git switch",
  "git branch",
  "git merge",
  "git rebase",
  "git pull",
  "git push",
]
"git-log" = ["git log", "git show", "git cherry-pick", "git revert"]
"git-worktrees" = ["git worktree remove"]
"docker-images" = ["docker run"]
"git-repos" = ["code", "git clone"]

# Ctrl+R is listed for completeness; atuin is initialised after tv in .zshrc and takes it.
[shell_integration.keybindings]
"smart_autocomplete" = "ctrl-t"
"command_history" = "ctrl-r"
